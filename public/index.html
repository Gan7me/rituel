<body>
<div id="boot" aria-hidden="true"><div class="bl"><i class="bm"></i><b>Rituel</b><span class="bline"></span></div></div>
<script>document.getElementById('boot').dataset.t0=Date.now();setTimeout(function(){var b=document.getElementById('boot');if(b){b.classList.add('out');setTimeout(function(){b.remove()},450)}},4000);
/* Filet d'affichage : si rien n'est visible 12 s après l'ouverture (script non chargé, compte sans données, erreur avant le démarrage), un écran lisible remplace le vide, avec de quoi diagnostiquer. */
window.__bootErr=null;window.addEventListener('error',function(e){if(!window.__bootErr)window.__bootErr=String(e.message||'')+' ('+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')+')';});
setTimeout(function(){var m=document.querySelector('main');if(!m)return;var vis=m.innerText.replace(/\s+/g,'').length>0||document.querySelector('.gate,.onb,#sheet.on');if(vis)return;
var v=(typeof APP_VERSION!=='undefined')?APP_VERSION:'script non chargé';var u=(typeof USER!=='undefined'&&USER)?'compte connecté':'aucun compte';var err=window.__bootErr?'<p style="font-size:13px;opacity:.7">'+window.__bootErr.replace(/</g,'&lt;')+'</p>':'';
m.innerHTML='<section style="padding:32px 20px;text-align:center;font-family:system-ui,sans-serif"><h2 style="margin:0 0 8px">Rituel n\'a pas pu afficher ton écran</h2><p style="opacity:.8">'+v+' · '+u+' · '+(navigator.onLine?'réseau ok':'hors ligne')+'</p>'+err+'<p><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:12px;background:#D8382B;color:#fff;font-weight:700;font-size:16px">Recharger</button></p><p><button onclick="(async function(){try{if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();for(var r of rs)await r.unregister();}if(window.caches){var ks=await caches.keys();for(var k of ks)await caches.delete(k);}}catch(e){}location.reload(true)})()" style="padding:10px 18px;border:1px solid #888;border-radius:12px;background:transparent;color:inherit;font-size:14px">Réinstaller l\'app (vide le cache)</button></p></section>';},12000);</script>
<header class="top"><div class="wrap">
  <div class="brand"><i class="mark" aria-hidden="true"></i><span class="bname">Rituel</span></div>
  <div class="spacer"></div>
  <button class="chip week" id="weekChip" title="Changer de semaine" hidden>S1</button>
  <button class="chip sync off" id="syncChip" title="Synchroniser maintenant" aria-label="Synchronisation">local</button>
  <button class="avatar" id="settingsBtn" aria-label="Réglages">·</button>
</div></header>

<main class="wrap">
  <section id="tab-home"></section>
  <section id="tab-seance" hidden></section>
  <section id="tab-coach" hidden></section>
  <section id="tab-programme" hidden></section>
  <section id="tab-suivi" hidden></section>
  <section id="tab-reglages" hidden></section>
</main>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div class="wrap">
    <div class="t" id="tT">0:00</div>
    <div class="lab"><b id="tL1">Repos</b><span id="tL2"></span></div>
    <div class="btns"><button id="tMinus" aria-label="Moins 15 secondes">−15 s</button><button id="tPlus" aria-label="Plus 30 secondes">+30 s</button><button id="tStop" aria-label="Arrêter">Stop</button></div>
  </div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Aujourd'hui</span></button>
  <button role="tab" aria-selected="false" data-tab="seance"><svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Séance</span></button>
  <button role="tab" aria-selected="false" data-tab="coach"><i class="tabmk" aria-hidden="true"></i><span>Kai</span></button>
  <button role="tab" aria-selected="false" data-tab="programme"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Programme</span></button>
  <button role="tab" aria-selected="false" data-tab="suivi"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Progrès</span></button>
</nav>
