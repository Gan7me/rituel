<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rituel</title>
<meta name="description" content="Programme, saisie des séries, chrono de repos et suivi de progression. Fonctionne hors ligne.">
<meta name="theme-color" content="#161C24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rituel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Rituel<small>Mésocycle 1 · septembre 2026</small></div>
  <div class="spacer"></div>
  <button class="chip week" id="weekChip" title="Changer de semaine">S1</button>
  <button class="chip sync off" id="syncChip" title="Synchroniser maintenant" aria-label="Synchronisation">local</button>
</div></header>

<main class="wrap">
  <section id="tab-seance"></section>
  <section id="tab-coach" hidden></section>
  <section id="tab-programme" hidden></section>
  <section id="tab-suivi" hidden></section>
  <section id="tab-cycle" hidden class="doc"></section>
  <section id="tab-reglages" hidden></section>
</main>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div class="wrap">
    <div class="t" id="tT">0:00</div>
    <div class="lab"><b id="tL1">Repos</b><span id="tL2"></span></div>
    <button id="tMinus" aria-label="Moins 15 secondes">−15</button>
    <button id="tPlus" aria-label="Plus 30 secondes">+30</button>
    <button id="tStop" aria-label="Arrêter">Stop</button>
  </div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="seance"><svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Séance</span></button>
  <button role="tab" aria-selected="false" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 1 7 7c0 2.5-1.3 4.2-2.6 5.6-.8.9-1.4 1.6-1.4 2.4v1H9v-1c0-.8-.6-1.5-1.4-2.4C6.3 14.2 5 12.5 5 10a7 7 0 0 1 7-7zM9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Coach</span></button>
  <button role="tab" aria-selected="false" data-tab="programme"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Programme</span></button>
  <button role="tab" aria-selected="false" data-tab="suivi"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Suivi</span></button>
  <button role="tab" aria-selected="false" data-tab="cycle"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Cycle</span></button>
  <button role="tab" aria-selected="false" data-tab="reglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Réglages</span></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
