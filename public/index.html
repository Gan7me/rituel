<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rituel</title>
<meta name="description" content="Programme, saisie des séries, chrono de repos et suivi de progression. Fonctionne hors ligne.">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rituel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-750x1334.png">
<link rel="icon" href="icons/favicon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i class="mark" aria-hidden="true"></i><span class="bname">Rituel</span></div>
  <div class="spacer"></div>
  <button class="chip week" id="weekChip" title="Changer de semaine" hidden>S1</button>
  <button class="chip sync off" id="syncChip" title="Synchroniser maintenant" aria-label="Synchronisation">local</button>
  <button class="avatar" id="settingsBtn" aria-label="Réglages">·</button>
</div></header>

<main class="wrap">
  <section id="tab-home"></section>
  <section id="tab-seance" hidden></section>
  <section id="tab-coach" hidden></section>
  <section id="tab-programme" hidden></section>
  <section id="tab-suivi" hidden></section>
  <section id="tab-reglages" hidden></section>
</main>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div class="wrap">
    <div class="t" id="tT">0:00</div>
    <div class="lab"><b id="tL1">Repos</b><span id="tL2"></span></div>
    <div class="btns"><button id="tMinus" aria-label="Moins 15 secondes">−15 s</button><button id="tPlus" aria-label="Plus 30 secondes">+30 s</button><button id="tStop" aria-label="Arrêter">Stop</button></div>
  </div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Aujourd'hui</span></button>
  <button role="tab" aria-selected="false" data-tab="seance"><svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Séance</span></button>
  <button role="tab" aria-selected="false" data-tab="coach"><i class="tabmk" aria-hidden="true"></i><span>Kai</span></button>
  <button role="tab" aria-selected="false" data-tab="programme"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Programme</span></button>
  <button role="tab" aria-selected="false" data-tab="suivi"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Progrès</span></button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="muscles.js"></script>
<script src="app.js"></script>
</body>
</html>
