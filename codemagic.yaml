# Codemagic — build iOS (TestFlight) et Android (AAB) depuis ce dépôt, sans Mac local.
# À configurer une fois dans Codemagic : intégration App Store Connect (clé API), keystore Android, groupe de variables "rituel".
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rituel_asc   # nom de l'intégration créée dans Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.rituel.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dépendances
        script: npm ci || npm install
      - name: Plateforme iOS
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Signature
        script: xcode-project use-profiles
      - name: Numéro de build
        script: agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: Build
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-aab:
    name: Android → AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - rituel_keystore                # keystore ajouté dans Codemagic
      node: 20
      java: 17
    scripts:
      - name: Dépendances
        script: npm ci || npm install
      - name: Plateforme Android
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Build
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
